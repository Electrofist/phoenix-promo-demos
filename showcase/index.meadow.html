<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2733; --mute: #8f8a98; --line: #ece9f0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #fff; color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; padding: 56px 16px 120px; overflow-x: hidden; user-select: none; -webkit-user-select: none; }
  .credit { position: fixed; top: 14px; left: 16px; line-height: 1.35; }
  .credit b { font: 600 15px 'Pixelify Sans', system-ui, sans-serif; letter-spacing: .01em; display: flex; align-items: center; gap: 6px; }
  .credit b i { width: 14px; height: 14px; display: inline-block; background: conic-gradient(from 45deg, #f27b9b 0 25%, #ffd34d 0 50%, #7fd3cf 0 75%, #b9a4f2 0); image-rendering: pixelated; border-radius: 3px; }
  .credit span { color: var(--mute); font-size: 11px; display: block; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; }
  #view { display: block; image-rendering: pixelated; cursor: pointer; touch-action: none; }
  .cap { text-align: center; margin-top: 18px; min-height: 40px; }
  .cap b { display: block; font: 600 15px 'Pixelify Sans', system-ui, sans-serif; letter-spacing: .01em; }
  .cap span { color: var(--mute); font-size: 12px; }
  .hint { color: #a9a4b2; font-size: 11.5px; margin-top: 26px; text-align: center; max-width: 560px; }
  .dock { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 9px 12px 7px; box-shadow: 0 10px 30px -12px rgba(60, 40, 90, .22); }
  .thumb { border: 0; background: none; padding: 0 0 6px; cursor: pointer; position: relative; }
  .thumb canvas { width: 68px; height: 51px; display: block; image-rendering: pixelated; border-radius: 4px; transition: transform .25s cubic-bezier(.3,1.5,.5,1); }
  .thumb:hover canvas { transform: translateY(-3px) rotate(-2deg); }
  .thumb::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 0; height: 2px; border-radius: 2px; background: var(--ink); transform: scaleX(0); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
  .thumb[aria-pressed="true"]::after { transform: scaleX(1); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px 8px; }
  .ctl { width: 34px; height: 34px; border: 0; border-radius: 10px; background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; font: 600 13px 'Pixelify Sans', system-ui, sans-serif; margin-bottom: 4px; }
  .ctl:hover { background: #f5f3f8; }
  .ctl svg { width: 14px; height: 14px; }
  @media (max-width: 560px) { .thumb canvas { width: 52px; height: 39px; } .dock { gap: 6px; padding: 7px 8px 5px; } .credit span { display: none; } }
</style>
</head>
<body>
<div class="credit"><b><i></i>Pocket Meadow</b><span>four tiny worlds · made in Phoenix Code with Claude</span></div>

<div class="stage">
  <canvas id="view" aria-label="Interactive pixel diorama"></canvas>
  <div class="cap"><b id="title"></b><span id="sub"></span></div>
</div>
<p class="hint" id="hint"></p>

<nav class="dock" id="dock" aria-label="Scenes">
  <span class="sep"></span>
  <button class="ctl" id="pause" aria-label="Pause"><svg viewBox="0 0 14 14"><rect x="3" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="8" y="2" width="3" height="10" rx="1" fill="currentColor"/></svg></button>
  <button class="ctl" id="sound" aria-label="Sound">♪</button>
</nav>

<script>
(() => {
/* ============================================================
   Pixel engine: a 168 × 126 world, drawn pixel by pixel each frame
   ============================================================ */
const W = 168, H = 126, N = W * H;
const low = document.createElement('canvas'); low.width = W; low.height = H;
const lg = low.getContext('2d');
const img = lg.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);
const base = new Uint32Array(N);       // a scene's static backdrop
const prev = new Uint32Array(N);       // last frame, for the pixel-dissolve between scenes

const C = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const hex = h => C(parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bay = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];
const hash2 = (x, y) => { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const noise = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy); const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
const fbm = (x, y) => noise(x, y) * .6 + noise(x * 2.1 + 7, y * 2.1) * .28 + noise(x * 4.3, y * 4.3 + 3) * .12;
const rng = s => () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
/* dithered gradient: stops = [[pos, color], ...] */
const grad = (t, stops, x, y) => { t = clamp(t, 0, 1); for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const [p0, c0] = stops[i - 1], [p1, c1] = stops[i]; return (t - p0) / (p1 - p0) > bay(x, y) ? c1 : c0; } return stops[stops.length - 1][1]; };

const P = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return; buf[y * W + x] = c; };
const G = (x, y) => { x = Math.round(x); y = Math.round(y); return (x < 0 || y < 0 || x >= W || y >= H) ? 0 : buf[y * W + x]; };
const blend = (x, y, r, g, b, a) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return; const i = y * W + x, c = buf[i]; const cr = c & 255, cg = (c >>> 8) & 255, cb = (c >>> 16) & 255; buf[i] = C(cr + (r - cr) * a | 0, cg + (g - cg) * a | 0, cb + (b - cb) * a | 0); };
const disc = (cx, cy, r, c) => { for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) { const dx = x + .5 - cx, dy = y + .5 - cy; if (dx * dx + dy * dy <= r * r) P(x, y, c); } };
const line = (x0, y0, x1, y1, c) => { x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (let n = 0; n < 400; n++) { P(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } };
const HEART = ['.x.x.', 'xxxxx', 'xxxxx', '.xxx.', '..x..'];
const heart = (x, y, c) => HEART.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'x') P(x - 2 + i, y - 2 + j, c); }));

/* a fluffy pom-pom flower head, lit from the top-left */
const pompom = (cx, cy, r, pal, seed) => {
  if (r < 1.2) { P(cx, cy, pal.m); P(cx, cy - 1, pal.l); return; }
  for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
    const dx = x + .5 - cx, dy = (y + .5 - cy) * 1.12, d = Math.hypot(dx, dy) / r; if (d > 1.05) continue;
    const a = Math.atan2(dy, dx), edge = 1 - .13 * (.5 + .5 * Math.cos(a * 7 + seed));
    if (d > edge) continue;
    const lit = (-dx * .65 - dy * .75) / r, ring = (d * 2.3 + .35 * Math.sin(a * 5 + seed * 2)) % 1;
    let c = pal.m;
    if (d > edge - .16) c = lit > .25 ? pal.d : pal.o;
    else if (ring < .2) c = lit > .1 ? pal.m : pal.d;
    else if (lit > .32) c = d < .45 ? pal.h : pal.l;
    else if (lit > .05) c = pal.l;
    P(x, y, c);
  }
  if (r > 3) { P(cx - r * .25, cy - r * .3, pal.h); }
};

/* shared particles: petals, sparks, hearts, droplets */
const parts = [];
const spawn = o => { parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, decay: .5, kind: 'px', drag: 0 }, o)); if (parts.length > 700) parts.shift(); };
const stepParts = (dt, wind = 0) => {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.vy += p.g * dt; p.vx += (wind * (p.drag || 0) - p.vx * (p.drag ? .8 : 0)) * dt;
    if (p.kind === 'petal') p.vx += Math.sin(p.life * 9 + p.ph) * 6 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * p.decay;
    if (p.life <= 0 || p.y > H + 4) parts.splice(i, 1);
  }
};
const drawParts = () => {
  for (const p of parts) {
    if (p.life < .35 && bay(p.x | 0, p.y | 0) > p.life / .35) continue;
    if (p.kind === 'heart') heart(p.x, p.y, p.c);
    else if (p.kind === 'spark') { const on = (p.life * 10 | 0) % 2; P(p.x, p.y, p.c); if (on) { P(p.x - 1, p.y, p.c2); P(p.x + 1, p.y, p.c2); P(p.x, p.y - 1, p.c2); P(p.x, p.y + 1, p.c2); } }
    else P(p.x, p.y, p.c);
  }
};
const hearts = (x, y, c, n = 1) => { for (let i = 0; i < n; i++) spawn({ x: x + (Math.random() - .5) * 6 * i, y: y - i * 2, vx: (Math.random() - .5) * 6, vy: -14 - Math.random() * 6, decay: .55, kind: 'heart', c }); };
const sparkle = (x, y, c, c2) => spawn({ x, y, vx: (Math.random() - .5) * 10, vy: -4 - Math.random() * 6, decay: .9, kind: 'spark', c, c2 });

/* tiny sounds */
let AC = null, soundOn = true;
const tone = (f, dur = .3, type = 'triangle', vol = .1, slide = 0, delay = 0) => {
  if (!soundOn) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch { return; }
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur * .8);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
};
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
const chime = (k = 2) => [0, 2, 4].forEach((s, i) => tone(PENTA[Math.min(7, k + s)], .55, 'sine', .07, 0, i * .07));

/* ============================================================
   Scene 1 · Clover hill
   ============================================================ */
const spring = (() => {
  const S = { name: 'Clover hill', sub: 'Spring · pink pom-poms over the hill', hint: 'Tap a flower to scatter its petals · tap the sky to call the butterfly · drag to fly with it' };
  const SKY = [[0, hex('#47abf4')], [.62, hex('#86cbfa')], [1, hex('#cdeafd')]];
  const FAR = [[0, hex('#f1f2bc')], [.45, hex('#dbeaa0')], [1, hex('#b5d77f')]];
  const MEAD = [hex('#185c33'), hex('#226f3d'), hex('#2d874b'), hex('#3c9f57'), hex('#5ab765')];
  const PINK = { o: hex('#b8325b'), d: hex('#dd5a80'), m: hex('#f27b9b'), l: hex('#ffc0d0'), h: hex('#fff2f6') };
  const LILAC = { o: hex('#7a52b8'), d: hex('#9a72d6'), m: hex('#b996ee'), l: hex('#e0ccff'), h: hex('#f8f2ff') };
  const STEM = hex('#2a773b'), LEAF = hex('#4aa755'), LEAF2 = hex('#2f8a42');
  const CL = hex('#ffffff'), CL2 = hex('#e6f4fe'), CL3 = hex('#cfe9fc');
  const WG = { o: hex('#e07a1f'), m: hex('#ffd34d'), l: hex('#fff5c2'), b: hex('#3a2b4f') };
  const hz = new Float32Array(W), mz = new Float32Array(W);
  let wind = 0;
  S.init = () => {
    for (let x = 0; x < W; x++) { hz[x] = 38 + x * .15 + Math.sin(x * .045) * 3; mz[x] = 64 + Math.sin(x * .06 + 1) * 3 + Math.sin(x * .17) * 1.2; }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let c;
      if (y < hz[x]) c = grad(y / hz[x], SKY, x, y);
      else if (y < mz[x]) { const f = (y - hz[x]) / (mz[x] - hz[x]); c = grad(f + (noise(x * .07, y * .3) - .5) * .5, FAR, x, y); }
      else { const v = fbm(x * .11, y * .13) - (y - mz[x]) / (H - mz[x]) * .22; c = v > .62 ? MEAD[4] : v > .52 ? MEAD[3] : v > .42 ? MEAD[2] : v > .32 ? MEAD[1] : MEAD[0]; }
      base[y * W + x] = c;
    }
    const R = rng(11); S.fl = [];
    for (let i = 0; i < 62; i++) { const y = 62 + Math.pow(R(), .75) * 72, r = 1.3 + (y - 62) / 72 * 7.6; S.fl.push({ x: R() * (W + 12) - 6, y, r, ph: R() * TAU, seed: R() * 10, k: 1, pal: R() < .14 ? LILAC : PINK }); }
    S.fl.sort((a, b) => a.y - b.y);
    S.b = { x: W * .62, y: 40, vx: 0, vy: 0, tx: W * .62, ty: 40, next: 1, perch: null, aim: null, pt: 0 };
    S.drag = null; parts.length = 0;
  };
  const head = (f, t) => ({ x: f.x + Math.sin(t * 1.3 + f.x * .07 + f.ph) * (.6 + f.r * .18) + wind * f.r * .25, y: f.y - (f.r * 2.4 + 2) * (.5 + .5 * f.k) });
  S.step = (dt, t) => {
    wind = Math.sin(t * .45) * .7 + Math.sin(t * 1.7 + 1) * .25;
    for (const f of S.fl) if (f.k < 1) f.k = Math.min(1, f.k + dt * .2);
    const b = S.b;
    if (S.drag) { b.tx = S.drag.x; b.ty = S.drag.y - 4; b.perch = b.aim = null; if (Math.random() < dt * 14) sparkle(b.x, b.y + 2, WG.l, WG.m); }
    else if (b.perch) { const h = head(b.perch, t); b.tx = h.x; b.ty = h.y - 2; if ((b.pt -= dt) < 0 || b.perch.k < .9) { b.perch = null; b.next = 0; } }
    else {
      if ((b.next -= dt) < 0) {
        b.next = 2.2 + Math.random() * 3;
        const opts = S.fl.filter(f => f.k > .95 && f.y > 78);
        if (Math.random() < .5 && opts.length) b.aim = opts[(Math.random() * opts.length) | 0];
        else { b.aim = null; b.tx = 12 + Math.random() * (W - 24); b.ty = 14 + Math.random() * 56; }
      }
      if (b.aim) { const h = head(b.aim, t); b.tx = h.x; b.ty = h.y - 2; if (Math.hypot(b.x - b.tx, b.y - b.ty) < 1.6) { b.perch = b.aim; b.aim = null; b.pt = 2 + Math.random() * 2.5; } }
    }
    const k = S.drag ? 6 : b.perch ? 9 : 1.4;
    b.vx += ((b.tx - b.x) * k - b.vx) * Math.min(1, dt * 3); b.vy += ((b.ty - b.y) * k - b.vy) * Math.min(1, dt * 3);
    b.x += b.vx * dt; b.y += b.vy * dt;
    stepParts(dt, wind * 14);
  };
  const drawFly = (b, t) => {
    const fl = b.perch ? .45 + .35 * Math.sin(t * 2.5) : Math.abs(Math.sin(t * 15));
    const bx = Math.round(b.x), by = Math.round(b.y + (b.perch ? 0 : Math.sin(t * 5) * .7));
    const ww = Math.max(1, Math.round(fl * 4.4));
    for (const s of [-1, 1]) {
      for (let i = 1; i <= ww; i++) for (let j = -4; j <= 0; j++) { const e = (i / (ww + .5)) ** 2 + ((j + 1.6) / 2.7) ** 2; if (e > 1) continue; P(bx + s * i, by + j, e > .62 ? WG.o : (i === Math.ceil(ww * .55) && j === -2) ? WG.l : WG.m); }
      const lw = Math.max(1, ww - 1);
      for (let i = 1; i <= lw; i++) for (let j = 1; j <= 3; j++) { const e = (i / (lw + .4)) ** 2 + ((j - .8) / 2.4) ** 2; if (e > 1) continue; P(bx + s * i, by + j, e > .55 ? WG.o : WG.m); }
    }
    for (let j = -2; j <= 2; j++) P(bx, by + j, WG.b);
    P(bx - 1, by - 3, WG.b); P(bx - 2, by - 4, WG.b); P(bx + 1, by - 3, WG.b); P(bx + 2, by - 4, WG.b);
  };
  S.draw = t => {
    buf.set(base);
    // clouds drift across the sky only
    for (let y = 2; y < 46; y++) for (let x = 0; x < W; x++) {
      if (y >= hz[x] - 1) continue;
      const v = noise(x * .045 + t * .03, y * .11) + noise(x * .1 - t * .02, y * .22 + 4) * .42 - (y / 46) * .25;
      if (v > 1.0) buf[y * W + x] = v > 1.08 ? CL : (v - 1.0) / .08 > bay(x, y) ? CL : CL2;
      else if (v > .96 && bay(x, y) < (v - .96) / .04) buf[y * W + x] = CL3;
    }
    for (const f of S.fl) {
      const h = head(f, t), r = f.r * (.25 + .75 * f.k);
      line(f.x, f.y, h.x, h.y + r * .6, STEM);
      if (f.r > 3) { const ly = f.y - f.r * .6; disc(f.x - f.r * .45, ly, f.r * .32, LEAF2); disc(f.x + f.r * .4, ly + 1, f.r * .28, LEAF); }
      if (f.k < .3) disc(h.x, h.y, Math.max(1, f.r * .3), LEAF); else pompom(h.x, h.y, r, f.pal, f.seed);
    }
    drawParts();
    drawFly(S.b, t);
  };
  S.tap = (x, y, t) => {
    for (let i = S.fl.length - 1; i >= 0; i--) {
      const f = S.fl[i], h = head(f, t); if (f.k < .7) continue;
      if (Math.hypot(x - h.x, (y - h.y) * 1.1) <= f.r + 1.2) {
        const cols = [f.pal.m, f.pal.l, f.pal.d, f.pal.h];
        for (let n = 0; n < 14 + f.r * 3; n++) { const a = Math.random() * TAU, s = 6 + Math.random() * 16; spawn({ x: h.x + Math.cos(a) * f.r * .5, y: h.y + Math.sin(a) * f.r * .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 8, g: 7, decay: .28 + Math.random() * .2, kind: 'petal', drag: 1, ph: Math.random() * 6, c: cols[(Math.random() * 4) | 0] }); }
        f.k = .12; tone(PENTA[clamp(7 - Math.round(f.r / 1.3), 0, 7)], .35, 'triangle', .09); return;
      }
    }
    const b = S.b; b.perch = b.aim = null; b.tx = x; b.ty = y; b.next = 3.5; hearts(x, y - 2, PINK.m); chime(1);
  };
  S.drag_ = (x, y) => { S.drag = { x, y }; };
  S.up = () => { S.drag = null; S.b.next = 1.5; };
  return S;
})();

/* ============================================================
   Scene 2 · Koi pond
   ============================================================ */
const pond = (() => {
  const S = { name: 'Koi pond', sub: 'Summer · three koi and a very patient frog', hint: 'Tap the water to feed the koi · tap a koi to make it splash · tap the frog · drag and they follow' };
  const WAT = [[0, hex('#1a6370')], [.5, hex('#227a85')], [1, hex('#2b8e95')]];
  const CAU = hex('#4fb3b1'), CAU2 = hex('#86d6cd'), SHAD = hex('#16525d'), RIP = hex('#c4f0e6');
  const GR = [hex('#3e8f47'), hex('#56a957'), hex('#79c164'), hex('#2f7a3d')], MUD = hex('#3b5f45'), WET = hex('#14505a');
  const STONE = [hex('#8e979d'), hex('#b4bcc1'), hex('#dfe4e6')];
  const PAD = { o: hex('#2a6f3c'), m: hex('#3f9a52'), l: hex('#62b866') };
  const LOTUS = { o: hex('#c23f68'), d: hex('#e46a8e'), m: hex('#f58fab'), l: hex('#ffd0dc'), h: hex('#fff4f7') };
  const FROG = { o: hex('#2f6b2f'), m: hex('#69b84a'), l: hex('#a6dc6a'), e: hex('#1e1e26'), w: hex('#fffbe8'), b: hex('#f0f6c8') };

    for (const f of S.flies) { const k = Math.pow(Math.max(0, Math.sin(f.ph)), 3); if (k > .04) glow(f.x, f.y, k, false); else P(f.x, f.y, hex('#3a3426')); }
    drawParts();
  };
  S.tap = (x, y, t) => {
    const c = S.cat;
    if (Math.abs(x - (c.x - 1)) < 5 && y > c.y - 11 && y < c.y + 1) { c.happy = 1.6; hearts(c.x, c.y - 12, hex('#ff9fb8'), 2); tone(660, .5, 'sawtooth', .04, .7); tone(880, .4, 'sine', .05, .8, .08); return; }
    S.sync = 6;
    S.flies.forEach((f, i) => { if (Math.hypot(f.x - x, f.y - y) < 90 || i % 2 === 0) { const a = Math.random() * TAU, r = 4 + Math.random() * 12; f.gather = 5; f.gx = x + Math.cos(a) * r; f.gy = y + Math.sin(a) * r * .7; } });
    chime(3);
  };
  S.drag_ = (x, y) => { S.drag = { x, y }; if (Math.random() < .3) sparkle(x, y, hex('#fffbd0'), hex('#c9b84a')); };
  S.up = () => { S.drag = null; };
  return S;
})();

/* ============================================================
   Scene 4 · First snow
   ============================================================ */
const snow = (() => {
  const S = { name: 'First snow', sub: 'Winter · a bunny and the quietest hill', hint: 'Tap the snow and the bunny hops over · tap the bunny · drag to make the wind blow' };
  const SKY = [[0, hex('#aec6df')], [.6, hex('#d2e0ee')], [1, hex('#edf3f9')]];
  const FAR = [[0, hex('#d6e2ef')], [1, hex('#c2d3e6')]];
  const SN = [hex('#ffffff'), hex('#eef4fa'), hex('#d9e5f1'), hex('#bccfe3')];
  const PINE = [hex('#244f45'), hex('#2f6356'), hex('#3d7767')], TRUNK = hex('#6b4b3a');
  const BUN = { w: hex('#ffffff'), o: hex('#b9c6d8'), s: hex('#e3eaf3'), p: hex('#f7b0c2'), e: hex('#2a2a35'), n: hex('#ef8aa4') };
  const ICE = [hex('#b9d6ec'), hex('#d6e9f6'), hex('#ffffff')];
  const gy = new Float32Array(W), acc = new Float32Array(W), fz = new Float32Array(W);
  S.init = () => {
    for (let x = 0; x < W; x++) { gy[x] = 98 + Math.sin(x * .045) * 3 + Math.sin(x * .13 + 2) * 1.3; fz[x] = 70 + Math.sin(x * .03 + 2) * 7 + Math.sin(x * .08) * 2; acc[x] = 0; }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let c;
      if (y < fz[x]) c = grad(y / fz[x], SKY, x, y);
      else c = grad((y - fz[x]) / 26 + (noise(x * .08, y * .2) - .5) * .4, FAR, x, y);
      base[y * W + x] = c;
    }
    // pines with snow on every tier
    const pine = (px, py, s) => {
      for (let y = 0; y < 3 * s; y++) base[(py - y) * W + px] = TRUNK;
      for (let tier = 0; tier < 4; tier++) { const ty = py - 2 * s - tier * 4 * s * .75, w = (7 - tier * 1.5) * s;
        for (let j = 0; j < 5 * s; j++) { const half = w * (j / (5 * s)); for (let i = -half; i <= half; i++) { const x = Math.round(px + i), y = Math.round(ty - 5 * s + j); if (x < 0 || x >= W || y < 0) continue; const top = j < 1.4 * s || (j < 2.2 * s && Math.abs(i) > half - 1.5); base[y * W + x] = top ? (i < 0 ? SN[0] : SN[1]) : PINE[(i < 0 ? 2 : i < half * .5 ? 1 : 0)]; } } }
    };
    pine(24, 92, 1.1); pine(40, 96, .8); pine(140, 94, 1.25); pine(158, 98, .9); pine(116, 82, .55); pine(70, 78, .5);
    const R = rng(31);
    S.flakes = Array.from({ length: 150 }, () => ({ x: R() * W, y: R() * H, v: 6 + R() * 10, big: R() < .2, ph: R() * TAU }));
    S.bun = { x: 80, dir: 1, hop: null, queue: 0, tx: 80, ear: 0, twitch: 0, happy: 0, spin: 0 };
    S.prints = []; S.wind = 0; S.windT = 0; S.drag = null; S.lastX = null; parts.length = 0;
  };
  const ground = x => { const i = clamp(Math.round(x), 0, W - 1); return gy[i] - acc[i]; };
  S.step = (dt, t) => {
    S.wind = lerp(S.wind, S.windT, dt * 1.5); S.windT *= Math.exp(-dt * .8);
    for (const f of S.flakes) {
      f.y += f.v * dt; f.x += (Math.sin(t * 1.3 + f.ph) * 3 + S.wind) * dt;
      if (f.x < -2) f.x = W + 1; if (f.x > W + 2) f.x = -1;
      if (f.y >= ground(f.x)) { const i = clamp(Math.round(f.x), 0, W - 1); acc[i] = Math.min(7, acc[i] + .035); if (i > 0) acc[i - 1] = Math.min(7, acc[i - 1] + .015); if (i < W - 1) acc[i + 1] = Math.min(7, acc[i + 1] + .015); f.y = -2; f.x = Math.random() * W; }
    }
    const b = S.bun; b.happy = Math.max(0, b.happy - dt); b.twitch += dt; b.ear = Math.max(0, b.ear - dt); if (Math.random() < dt * .3) b.ear = .8;
    if (b.hop) { b.hop.t += dt / .38; if (b.hop.t >= 1) { b.x = b.hop.to; S.prints.push({ x: b.x - b.dir * 2, age: 0 }, { x: b.x + b.dir, age: 0 }); b.hop = null; tone(330 + Math.random() * 60, .1, 'sine', .05, 1.6); } }
    if (!b.hop) {
      const d = b.tx - b.x;
      if (Math.abs(d) > 2) { b.dir = Math.sign(d); b.hop = { from: b.x, to: b.x + b.dir * Math.min(7, Math.abs(d)), t: 0, h: 6 }; }
      else if (Math.random() < dt * .25) { b.dir = Math.random() < .5 ? -1 : 1; b.tx = clamp(b.x + b.dir * (4 + Math.random() * 10), 10, W - 10); }
    }
    if (b.spin > 0) b.spin = Math.max(0, b.spin - dt * 1.6);
    for (const p of S.prints) p.age += dt; S.prints = S.prints.filter(p => p.age < 9);
    if (S.drag) { if (S.lastX !== null) S.windT = clamp((S.drag.x - S.lastX) / dt * .6, -40, 40); S.lastX = S.drag.x; }
    stepParts(dt);
  };
  const drawBunny = (t) => {
    const b = S.bun; let x = b.x, lift = 0, sq = 1;
    if (b.hop) { const k = b.hop.t; x = lerp(b.hop.from, b.hop.to, k); lift = Math.sin(k * Math.PI) * b.hop.h; sq = k < .15 || k > .85 ? .8 : 1.12; }
    if (b.spin > 0) lift = Math.sin(b.spin * Math.PI) * 12;
    const gyb = ground(x), cx = Math.round(x), cy = Math.round(gyb - 3.6 - lift), d = b.spin > 0 ? (Math.sin(b.spin * TAU * 2) > 0 ? 1 : -1) : b.dir;
    // shadow
    for (let i = -3; i <= 3; i++) if (bay(cx + i, Math.round(gyb)) < .6 - lift * .04) P(cx + i, Math.round(gyb), SN[3]);
    // body
    const rx = 5.4, ry = 3.8 * sq;
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let xx = Math.floor(cx - rx - 1); xx <= cx + rx + 1; xx++) { const e = ((xx + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2; if (e > 1) continue; P(xx, y, e > .72 ? BUN.o : (xx - cx) * d < -1.5 && y > cy ? BUN.s : BUN.w); }
    disc(cx - d * 5.6, cy - .8, 1.7, BUN.w); P(cx - d * 6.6, cy - 1, BUN.o);   // tail fluff
    // head
    const hx = cx + d * 4.2, hy = cy - 3.2 * sq;
    for (let y = Math.floor(hy - 4); y <= hy + 4; y++) for (let xx = Math.floor(hx - 4); xx <= hx + 4; xx++) { const e = Math.hypot(xx + .5 - hx, (y + .5 - hy) * 1.1) / 3.2; if (e > 1) continue; P(xx, y, e > .78 ? BUN.o : BUN.w); }
    // ears: one flops now and then
    for (const [s, flop] of [[0, b.ear > 0], [1, false]]) { const ex = hx - d * (s ? 1.4 : -.2), base_ = hy - 2.8; for (let j = 0; j < 5; j++) { const xx = flop ? ex + d * (j * .9 - .5) : ex - d * j * .25, yy = flop ? base_ - j * .5 : base_ - j; P(xx, yy, j === 4 ? BUN.o : BUN.w); if (j > 0 && j < 4 && !flop) P(xx + d * .6, yy, BUN.p); } }
    const shut = b.happy > 0 || (t % 4) > 3.85;
    P(hx + d * 1.2, hy - .4, shut ? BUN.o : BUN.e); P(hx + d * 2.8, hy + .7, BUN.n); P(hx + d * .2, hy + 1.2, BUN.p);
    if (b.happy > 0) { P(hx + d * .2, hy + .8, BUN.p); }
    if (Math.sin(b.twitch * 14) > .7) P(hx + d * 2.6, hy + .2, BUN.n);
  };
  S.draw = t => {
    buf.set(base);
    // frozen pond on the left
    for (let y = 104; y < 118; y++) for (let x = 6; x < 54; x++) { const e = ((x - 30) / 23) ** 2 + ((y - 111) / 6) ** 2; if (e > 1) continue; base[y * W + x]; buf[y * W + x] = e > .82 ? ICE[0] : ((x + y * 2 + Math.floor(t * 6)) % 23 === 0 ? ICE[2] : ICE[1]); }
    // snow ground, deeper where flakes have landed
    for (let x = 0; x < W; x++) { const top = Math.round(gy[x] - acc[x]); for (let y = top; y < H; y++) { if (x > 6 && x < 54 && y >= 104 && y < 118 && ((x - 30) / 23) ** 2 + ((y - 111) / 6) ** 2 <= 1) continue; const slope = (acc[Math.min(W - 1, x + 1)] - acc[Math.max(0, x - 1)]) + (gy[Math.min(W - 1, x + 1)] - gy[Math.max(0, x - 1)]) * .4; const dpt = y - top; buf[y * W + x] = dpt === 0 ? SN[0] : slope > .5 ? (bay(x, y) < .5 ? SN[2] : SN[1]) : dpt > 16 ? (bay(x, y) < .3 ? SN[2] : SN[1]) : SN[(noise(x * .2, y * .3) > .66) ? 1 : 0]; } }
    for (const p of S.prints) { const a = 1 - p.age / 9; const x = Math.round(p.x), y = Math.round(ground(p.x) + 1); if (bay(x, y) < a) { P(x, y, SN[3]); } }
    drawBunny(t);
    for (const f of S.flakes) { P(f.x, f.y, SN[0]); if (f.big) { P(f.x + 1, f.y, SN[1]); P(f.x - 1, f.y, SN[1]); P(f.x, f.y - 1, SN[1]); P(f.x, f.y + 1, SN[1]); } }
    drawParts();
  };
  S.tap = (x, y, t) => {
    const b = S.bun, by = ground(b.x) - 4;
    if (Math.hypot(x - b.x, y - by) < 7) { b.happy = 1.4; b.spin = 1; hearts(b.x, by - 8, BUN.n, 2); tone(523, .15, 'square', .05, 2); tone(784, .3, 'sine', .06, 1, .1); return; }
    b.tx = clamp(x, 8, W - 8); sparkle(x, Math.min(y, ground(x) - 1), SN[0], SN[2]); tone(PENTA[(Math.random() * 5) | 0], .25, 'sine', .06);
  };
  S.drag_ = (x, y) => { S.drag = { x, y }; };
  S.up = () => { S.drag = null; S.lastX = null; };
  return S;
})();

/* ============================================================
   Stage, scaling, the LED tile look, ragged edges, transitions
   ============================================================ */
const SCENES = [spring, pond, dusk, snow];
const view = document.getElementById('view'), vg = view.getContext('2d');
const mask = new Uint8Array(N), dissolve = new Float32Array(N);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x, d = Math.min(x, y, W - 1 - x, H - 1 - y), rough = noise(x * .32 + 11, y * .32) * 5 + bay(x, y) * 1.4;
  mask[i] = d < rough - .4 ? 1 : 0; dissolve[i] = hash2(x * 7 + 3, y * 13 + 1);
}
let S_ = 4, overlay = null;
const fit = () => {
  const avail = Math.min(innerWidth - 32, 760), availH = innerHeight - 260;
  S_ = Math.max(2, Math.min(6, Math.floor(Math.min(avail / W, availH / H))));
  const dpr = Math.min(devicePixelRatio || 1, 2);
  view.style.width = W * S_ + 'px'; view.style.height = H * S_ + 'px';
  view.width = W * S_ * dpr; view.height = H * S_ * dpr; vg.imageSmoothingEnabled = false;
  // LED-tile overlay: thin seams between pixels + a sparse dot grid, like a printed screen
  overlay = document.createElement('canvas'); overlay.width = view.width; overlay.height = view.height; const og = overlay.getContext('2d');
  const s = view.width / W; og.fillStyle = 'rgba(255,255,255,.16)';
  for (let x = 1; x < W; x++) og.fillRect(Math.round(x * s), 0, Math.max(1, dpr * .6), overlay.height);
  for (let y = 1; y < H; y++) og.fillRect(0, Math.round(y * s), overlay.width, Math.max(1, dpr * .6));
  og.fillStyle = 'rgba(255,255,255,.85)'; const ds = Math.max(1.4, s * .32);
  for (let y = 3; y < H; y += 7) for (let x = 3; x < W; x += 7) og.fillRect(Math.round((x + .5) * s - ds / 2), Math.round((y + .5) * s - ds / 2), Math.round(ds), Math.round(ds));
};
addEventListener('resize', fit); fit();

let cur = 0, t = 0, paused = false, trans = 1;
const titleEl = document.getElementById('title'), subEl = document.getElementById('sub'), hintEl = document.getElementById('hint');
const caption = () => { const s = SCENES[cur]; titleEl.textContent = s.name; subEl.textContent = s.sub; hintEl.textContent = s.hint; };

/* thumbnails: render every scene once, then start on the first */
const dock = document.getElementById('dock'), sep = dock.querySelector('.sep'), thumbs = [];
SCENES.forEach((s, i) => {
  s.init(); for (let k = 0; k < 90; k++) s.step(1 / 30, k / 30); s.draw(3);
  for (let j = 0; j < N; j++) if (mask[j]) buf[j] = 0;
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(img.data), W, H), 0, 0);
  const b = document.createElement('button'); b.className = 'thumb'; b.setAttribute('aria-label', s.name); b.appendChild(c); b.onclick = () => go(i);
  dock.insertBefore(b, sep); thumbs.push(b);
});
function go(i) {
  if (i === cur && trans >= 1 && SCENES[cur].ready) return;
  prev.set(buf); trans = 0; cur = i; parts.length = 0; SCENES[i].init(); SCENES[i].ready = true; t = 0;
  thumbs.forEach((b, k) => b.setAttribute('aria-pressed', k === i)); caption(); tone(PENTA[i + 2], .25, 'sine', .05);
}
SCENES[0].init(); SCENES[0].ready = true; thumbs[0].setAttribute('aria-pressed', 'true'); caption(); buf.fill(0); prev.fill(0); trans = 0;

/* pointer: tap vs drag, mapped into world pixels */
let down = null;
const toWorld = e => { const r = view.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
view.addEventListener('pointerdown', e => { view.setPointerCapture(e.pointerId); const [x, y] = toWorld(e); down = { x, y, dragging: false }; });
view.addEventListener('pointermove', e => { if (!down) return; const [x, y] = toWorld(e); if (!down.dragging && Math.hypot(x - down.x, y - down.y) > 3) down.dragging = true; if (down.dragging) SCENES[cur].drag_(x, y); });
const up = e => { if (!down) return; if (!down.dragging) SCENES[cur].tap(down.x, down.y, t); else SCENES[cur].up(); down = null; };
view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);

const pauseBtn = document.getElementById('pause'), soundBtn = document.getElementById('sound');
const PLAY = '<svg viewBox="0 0 14 14"><path d="M4 2.5v9l7.5-4.5z" fill="currentColor"/></svg>', PAUSE = pauseBtn.innerHTML;
pauseBtn.onclick = () => { paused = !paused; pauseBtn.innerHTML = paused ? PLAY : PAUSE; pauseBtn.setAttribute('aria-label', paused ? 'Play' : 'Pause'); };
soundBtn.onclick = () => { soundOn = !soundOn; soundBtn.style.opacity = soundOn ? 1 : .35; soundBtn.setAttribute('aria-pressed', soundOn); };
addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '4') go(+e.key - 1); if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); } });

let last = performance.now();
const frame = now => {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const s = SCENES[cur];
  if (!paused) { t += dt; s.step(dt, t); }
  s.draw(t);
  if (trans < 1) { trans = Math.min(1, trans + dt / .7); for (let i = 0; i < N; i++) if (dissolve[i] > trans) buf[i] = prev[i]; }
  for (let i = 0; i < N; i++) if (mask[i]) buf[i] = 0;
  lg.putImageData(img, 0, 0);
  vg.clearRect(0, 0, view.width, view.height);
  vg.drawImage(low, 0, 0, view.width, view.height);
  vg.globalCompositeOperation = 'source-atop'; vg.drawImage(overlay, 0, 0); vg.globalCompositeOperation = 'source-over';
};
requestAnimationFrame(frame);
window.meadow = { go, scenes: SCENES, tap: (x, y) => SCENES[cur].tap(x, y, t), drag: (x, y) => SCENES[cur].drag_(x, y), up: () => SCENES[cur].up() };
})();
</script>
