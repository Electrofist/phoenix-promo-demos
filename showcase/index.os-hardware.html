<!doctype html>
<html lang="en" data-skin="Hardware">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix OS · Hardware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os.css">
<style>
  /* Hardware skin: inspired by teenage engineering. Grey aluminium, black ink, one orange. */
  :root{
    --font:'Archivo',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --text:#111; --text-dim:#5c5c58; --accent:#ff4f00; --accent-ink:#111;
    --wallpaper:radial-gradient(circle at 1px 1px,rgba(0,0,0,.2) 1px,transparent 1.6px) 0 0/22px 22px,#cfd0cc;
    --menubar-bg:#111; --menubar-text:#e9e9e6; --menubar-border:#111;
    --win-bg:#efefeb; --win-border:1.5px solid #111; --win-radius:6px; --win-shadow:6px 6px 0 rgba(17,17,17,.9); --win-blur:none;
    --title-bg:#efefeb; --title-bg-inactive:#e1e1dc; --title-text:#111; --title-h:34px; --title-dir:row-reverse; --title-align:left;
    --title-transform:uppercase; --title-size:11px; --title-weight:700; --title-tracking:.14em; --inactive-title-opacity:.55;
    --wbtn-size:16px; --wbtn-radius:3px; --wbtn-close:#ff4f00; --wbtn-min:#111; --wbtn-max:#111; --wbtn-ink:#fff; --wbtn-glyph:1; --wbtn-gap:5px;
    --panel:#e3e3de; --panel-2:#d3d3cd; --line:#111;
    --btn-bg:#efefeb; --btn-text:#111; --btn-border:1.5px solid #111; --btn-radius:4px; --btn-shadow:2px 2px 0 #111;
    --dock-bg:#111; --dock-border:none; --dock-radius:8px; --dock-blur:none; --dock-shadow:6px 6px 0 rgba(17,17,17,.3); --dock-pad:10px;
    --tile-radius:6px; --icon-ink:#111; --tile-shadow:none; --tile-border:1.5px solid #111; --icon-stroke:1.7;
    --t-terminal:#e9e9e6; --t-files:#e9e9e6; --t-notes:#e9e9e6; --t-paint:#e9e9e6; --t-music:#ff4f00; --t-snake:#e9e9e6;
    --t-code:#e9e9e6; --t-settings:#b9b9b4; --t-about:#ff4f00; --t-trash:#b9b9b4;
    --term-bg:#111; --term-text:#e9e9e6; --term-prompt:#ff4f00; --term-dim:#8a8a85;
    --paper:#fafaf7; --sel:rgba(255,79,0,.35); --label-bg:#111; --desk-label:#111; --desk-label-shadow:none;
    --step-radius:3px; --step-border:1.5px solid #111; --step-on-shadow:none; --snake-radius:4px;
    --boot-bg:#cfd0cc; --boot-text:#111;
  }
  .win-name,.ui-btn,.seq-label,.mb-right,.dock-item .label,.toolbar b{font-family:var(--font-mono)}
  .ui-btn{text-transform:uppercase;font-size:11px;letter-spacing:.08em}
  .ui-btn:active{box-shadow:none;transform:translate(2px,2px)}
  .ui-btn.primary{background:#ff4f00;color:#111;border:1.5px solid #111}
  .win-title{border-bottom:1.5px solid #111}
  .toolbar{border-bottom:1.5px solid #111}
  .mb-logo{color:#ff4f00}
  .mb-app{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.12em;font-size:11px}
  .dock-item::after{background:#ff4f00;width:6px;height:6px;border-radius:0}
  .dock-item:hover{transform:translateY(-4px)}
  .watermark{font-family:var(--font-mono);font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(0,0,0,.07)}
  .desk-icon{font-family:var(--font-mono);text-transform:uppercase;font-size:10px;letter-spacing:.1em}
  .step.now{outline-color:#ff4f00}
  .viz{background:#111}
</style>
</head>
<body>
<script src="os.js"></script>
</body>
</html>
